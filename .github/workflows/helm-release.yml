name: Helm Release

on:
  # TODO: Consider triggering for pushes to main.
  workflow_dispatch: { }

permissions: { }

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      with:
        fetch-depth: "0"
    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # tag=v5.0.1
    - name: Import GPG Key
      env:
        GPG_PRIVATE_KEY: "${{ secrets.GPG_PRIVATE_KEY }}"
        GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"
      run: |
        printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
        gpg --batch --import <<< "$GPG_PRIVATE_KEY"
        
        # Helm signing needs a legacy keyring, which GnuPG >= 2.1 no longer maintains.
        # https://github.com/helm/helm/issues/31836
        gpg --batch --yes \
          --pinentry-mode loopback \
          --passphrase-file "$RUNNER_TEMP/gpg-passphrase" \
          --export-secret-keys > "$RUNNER_TEMP/secring.gpg"
    - name: Release Chart
      id: release
      uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # tag=v1.7.0
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        CR_SIGN: "true"
        CR_KEY: "${{ vars.GPG_KEY_NAME }}"
        CR_KEYRING: "${{ runner.temp }}/secring.gpg"
        CR_PASSPHRASE_FILE: "${{ runner.temp }}/gpg-passphrase"
      with:
        config: cr.yaml
    - name: Log in to GHCR
      if: steps.release.outputs.changed_charts != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # tag=v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push Charts to GHCR
      if: steps.release.outputs.changed_charts != ''
      run: |
        shopt -s nullglob
        for pkg in .cr-release-packages/*.tgz; do
          helm push "$pkg" oci://ghcr.io/dependencytrack/helm-charts
        done